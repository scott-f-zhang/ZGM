[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zgm"
version = "0.1.0"
description = "A btop-style terminal UI for planning local GPU tasks on a timeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "nvidia-ml-py>=12.0",
    "ruamel.yaml>=0.18",
    "psutil>=5.9",
]

[project.optional-dependencies]
ray = ["ray>=2.59"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
zgm = "zgm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zgm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["ray: requires the ray package"]
