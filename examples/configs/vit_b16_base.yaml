_scheduler_:
  gpus: 2
  run:
    cwd: ../project            # relative to this file
    script: train.py
    args: [--config, "{config}"]   # quote placeholders: {..} is a mapping in YAML
model:
  arch: vit_b16
  drop_path: 0.1
data:
  dataset: imagenet
  batch_size: 1024
optimizer:
  type: adamw
  lr: 1.0e-3
  weight_decay: 0.05
schedule:
  epochs: 300
